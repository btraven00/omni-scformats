# Every converter in one env, as crosscell's Dockerfile.benchmark does (one
# image, 5 tools), but on current releases, not the paper's (it ran anndataR
# 1.0.0, Seurat 5.4.0, anndata 0.12.x). Unpinned: resolved versions are
# recorded per run in the conda env and in out/.metadata. convert2anndata and
# easySCFr are GitHub-only: tools.post-deploy.sh.
name: crosscell-repro-tools
channels: [conda-forge, bioconda, "https://prefix.dev/almost-conductor"]
dependencies:
  - r-base>=4.5
  - r-seurat
  - bioconductor-zellkonverter
  - bioconductor-anndatar
  - bioconductor-singlecellexperiment
  - bioconductor-hdf5array
  - bioconductor-rhdf5
  - r-reticulate
  - r-anndata            # convert2anndata calls anndata::write_h5ad
  - r-hdf5r
  - r-remotes
  - r-obkit=0.0.4        # phase anchors
  - python=3.12
  - anndata=0.12.9      # the paper's; convert2anndata passes AnnData(dtype=), removed in 0.13
  - h5py
  - scipy
  - pandas
  - pip
  - pip:
      - easySCFpy
